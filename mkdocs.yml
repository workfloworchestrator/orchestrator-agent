# workfloworchestrator.github.io uses site_name in the URL, don't change it
site_name: Orchestrator Agent
site_description: An AI agent for Workflow Orchestrator that answers questions and starts workflows over OpenAI, A2A, AG-UI and MCP.
repo_url: "https://github.com/workfloworchestrator/orchestrator-agent"
repo_name: "workfloworchestrator/orchestrator-agent"
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Guides:
      - Connect LibreChat: guides/librechat.md
      - Use MCP clients: guides/mcp-clients.md
      - Use the agent from an A2A planner: guides/a2a-planner.md
      - Build a frontend with AG-UI: guides/ag-ui.md
      - Start workflows from chat: guides/workflows-from-chat.md
      - Use your own LLM: guides/own-llm.md
      - Teach the agent your domain: guides/domain-context.md
      - Give the agent your own tools: guides/own-tools.md
      - Security and observability: guides/security-observability.md
      - Enable AI search and embeddings: guides/ai-search.md
      - Benchmark prompt and model changes: guides/evals.md
  - Architecture:
      - How it works: architecture/index.md
      - How we evaluate the agent: architecture/evaluation.md
  - Reference:
      - Endpoints and protocols: reference/endpoints.md
      - Configuration: reference/configuration.md
      - Plugins: reference/plugins.md
      - Evals: reference/evals.md
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb-on
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - navigation.sections
plugins:
  - search
  # Renders Jinja like the hub does, so the {% raw %} around LibreChat placeholders behaves the same in both builds.
  - external-markdown
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
copyright: "&copy; 2026 Workflow Orchestrator Programme"
