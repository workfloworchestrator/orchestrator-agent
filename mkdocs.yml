# workfloworchestrator.github.io uses site_name in the URL, don't change it
site_name: Orchestrator Agent
site_description: An AI agent for Workflow Orchestrator that answers questions and starts workflows over OpenAI, A2A, AG-UI and MCP.
repo_url: "https://github.com/workfloworchestrator/orchestrator-agent"
repo_name: "workfloworchestrator/orchestrator-agent"
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Guides:
      - How to connect LibreChat: guides/librechat.md
      - How to use the agent with MCP: guides/mcp-clients.md
      - How to connect another agent over A2A: guides/a2a-planner.md
      - Build a frontend with AG-UI: guides/ag-ui.md
      - How to use your own LLM: guides/own-llm.md
      - How to teach the agent your domain: guides/domain-context.md
      - How to connect another service: guides/connect-service.md
      - How to create your own agent: guides/create-agent.md
      - How to secure the agent: guides/secure-agent.md
      - How to trace the agent: guides/tracing.md
      - How to benchmark prompt and model changes: guides/evals.md
      - How to add an evaluation case: guides/add-eval-case.md
  - Architecture:
      - How the agent fits on top of Orchestrator Core: architecture/index.md
      - Authentication and authorization: architecture/auth.md
      - Tracing and observability: architecture/observability.md
      - Understanding agent evaluations: architecture/evaluation.md
  - Reference:
      - Endpoints and protocols: reference/endpoints.md
      - Configuration: reference/configuration.md
      - Plugins: reference/plugins.md
      - Runtime behaviour: reference/runtime.md
      - Evals: reference/evals.md
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb-on
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - navigation.sections
plugins:
  - search
  # Renders Jinja like the hub does, so the {% raw %} around LibreChat placeholders behaves the same in both builds.
  - external-markdown
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
copyright: "&copy; 2026 Workflow Orchestrator Programme"
