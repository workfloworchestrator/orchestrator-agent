name: Test mkdocs build

on:
  # Called by ci.yml only, so the docs build is part of the single 'CI result'
  # check and does not run twice on a PR.
  workflow_call:

env:
  UV_LOCKED: true

jobs:
  mkdocs-build:
    name: Test mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install the docs dependencies
        run: uv sync --no-dev --group docs
      - name: Build the documentation with --strict
        run: uv run --no-sync mkdocs build --strict
