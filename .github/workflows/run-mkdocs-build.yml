name: Test mkdocs build

on:
  # Called by ci.yml so the docs build is part of the single 'CI result' check.
  workflow_call:
  # Keep the standalone check as well: it runs on PRs that ci.yml does not cover yet.
  pull_request:
    branches: ["main"]

env:
  UV_LOCKED: true

jobs:
  mkdocs-build:
    name: Test mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install the docs dependencies
        run: uv sync --no-dev --group docs
      - name: Build the documentation with --strict
        run: uv run --no-sync mkdocs build --strict
