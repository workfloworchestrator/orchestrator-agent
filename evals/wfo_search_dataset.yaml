# yaml-language-server: $schema=wfo_search_dataset_schema.json
name: wfo_search_dataset
cases:
- name: fuzzy-search-nodes
  inputs: find subscriptions for network nodes
  metadata:
    failure_modes:
    - fuzzy-search
    curation_note: Plain descriptive request; one fuzzy/semantic search, no filters
      needed.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory:
      - search
      order: exact
  - ArgumentCorrectness:
      tool_name: search
      expected_arguments:
        entity_type: SUBSCRIPTION
  - ToolResultContains:
      tool_name: search
      contains:
      - node asd001 (active)
      - node ams002 (active)
- name: filtered-search-active
  inputs: find all active subscriptions
  metadata:
    failure_modes:
    - structured-filters
    curation_note: A concrete dimension (status) must become a structured filter,
      and filter paths must come from discover_filter_paths, never guessed. in_order
      tolerates an extra get_valid_operators check at a small precision cost.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
    - discover_filter_paths
    - search
  - ArgumentCorrectness:
      tool_name: discover_filter_paths
      expected_arguments:
        entity_type: SUBSCRIPTION
  - ToolResultContains:
      tool_name: search
      contains:
      - node asd001 (active)
      - node ams002 (active)
      - core link 10G asd001 <-> ams002
      excludes:
      - node rtd003 (terminated)
      - node utr004 (provisioning)
- name: count-subscriptions
  inputs: how many subscriptions are there in total?
  metadata:
    failure_modes:
    - aggregation
    curation_note: A "how many" question is one count, not a search whose rows get
      counted.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory:
      - aggregate
      order: exact
  - ArgumentCorrectness:
      tool_name: aggregate
      expected_arguments:
        entity_type: SUBSCRIPTION
  - ToolResultContains:
      tool_name: aggregate
      contains:
      - '"total_count":5'
- name: count-by-status
  inputs: how many subscriptions are there per status?
  metadata:
    failure_modes:
    - aggregation
    - structured-filters
    curation_note: Grouped count; group_by paths need discovery just like filters.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
    - discover_filter_paths
    - aggregate
  - ArgumentCorrectness:
      tool_name: aggregate
      expected_arguments:
        entity_type: SUBSCRIPTION
  - ToolResultContains:
      tool_name: aggregate
      contains:
      - '"subscription_status":"active"'
      - '"subscription_status":"terminated"'
      - '"subscription_status":"provisioning"'
      - '"count":3'
- name: filtered-count-active
  inputs: show me how many active subscriptions there are
  metadata:
    failure_modes:
    - aggregation
    - structured-filters
    curation_note: '"Show me" with a quantity as its object is a count, not a search:
      the request is for a number about the subscriptions, not for the subscriptions
      themselves. The status is a structured filter, so its path is discovered first.'
  expected_output: null
  evaluators:
  - TrajectoryMatch:
    - discover_filter_paths
    - aggregate
  - ArgumentCorrectness:
      tool_name: aggregate
      expected_arguments:
        entity_type: SUBSCRIPTION
        operation: count
  - ToolResultContains:
      tool_name: aggregate
      contains:
      - '"total_count":3'
- name: resolve-by-prefix
  inputs: show details for subscription aa1b2c3d
  metadata:
    failure_modes:
    - entity-lookup
    curation_note: An id-prefix reference goes straight to resolve_entity, not search.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory:
      - resolve_entity
      order: exact
  - ArgumentCorrectness:
      tool_name: resolve_entity
      expected_arguments:
        entity_type: SUBSCRIPTION
        id_or_prefix: aa1b2c3d
  - ToolResultContains:
      tool_name: resolve_entity
      contains:
      - '"status":"candidates"'
- name: fetch-by-full-uuid
  inputs: look up subscription aa1b2c3d-0000-4000-8000-000000000003 and give me its
    details
  metadata:
    failure_modes:
    - entity-lookup
    curation_note: '"Give me" is a details fetch, not an export; resolving the id
      returns the one subscription with its header, so that call alone is the route,
      and the UUID must pass through verbatim.'
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory:
      - resolve_entity
      order: exact
  - ArgumentCorrectness:
      tool_name: resolve_entity
      expected_arguments:
        id_or_prefix: aa1b2c3d-0000-4000-8000-000000000003
        entity_type: SUBSCRIPTION
  - ToolResultContains:
      tool_name: resolve_entity
      contains:
      - '"status":"unique"'
      - core link 10G asd001 <-> ams002
- name: search-workflows
  inputs: search for workflows containing 'validate'
  metadata:
    failure_modes:
    - fuzzy-search
    - entity-type
    curation_note: The entity type must switch to WORKFLOW; the term is the query
      text.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory:
      - search
      order: exact
  - ArgumentCorrectness:
      tool_name: search
      expected_arguments:
        entity_type: WORKFLOW
        query_text: validate
  - ToolResultContains:
      tool_name: search
      contains:
      - Validate subscriptions
- name: export-after-search
  inputs: find core link subscriptions and export them as CSV
  metadata:
    failure_modes:
    - export
    curation_note: Explicit "export as CSV" sanctions export_query, after the search
      that produces the query to export.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory:
      - search
      - export_query
      order: exact
  - ArgumentCorrectness:
      tool_name: search
      expected_arguments:
        entity_type: SUBSCRIPTION
  - ToolResultContains:
      tool_name: search
      contains:
      - core link 10G asd001 <-> ams002
- name: export-named-alone
  inputs: export active subscriptions
  metadata:
    failure_modes:
    - export
    - structured-filters
    curation_note: Only the export is named and no query exists yet, so the search
      that produces the query comes first, in the same turn, with the status as a
      structured filter. Stopping after the search leaves the person without the file
      they asked for.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory:
      - discover_filter_paths
      - search
      - export_query
      order: exact
  - ArgumentCorrectness:
      tool_name: search
      expected_arguments:
        entity_type: SUBSCRIPTION
  - ToolResultContains:
      tool_name: search
      contains:
      - node asd001 (active)
      - node ams002 (active)
      - core link 10G asd001 <-> ams002
      excludes:
      - node rtd003 (terminated)
      - node utr004 (provisioning)
- name: negative-offtopic
  inputs: what is the weather in Amsterdam today?
  metadata:
    failure_modes:
    - negative-example
    curation_note: Out of scope for the orchestrator; the correct behavior is to answer/decline
      without calling any tool (empty expected trajectory scores 1.0 only when the
      agent also calls nothing).
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory: []
      order: exact
- name: negative-no-export
  inputs: show me the active subscriptions, no need for a file
  metadata:
    failure_modes:
    - export
    - structured-filters
    curation_note: '"Show me" is viewing, explicitly not an export; a trajectory ending
      in export_query loses precision here.'
  expected_output: null
  evaluators:
  - TrajectoryMatch:
    - discover_filter_paths
    - search
  - ToolResultContains:
      tool_name: search
      contains:
      - node asd001 (active)
      - node ams002 (active)
      - core link 10G asd001 <-> ams002
      excludes:
      - node rtd003 (terminated)
      - node utr004 (provisioning)
- name: form-fill-create-node
  inputs: create a new Cisco node named ams005
  metadata:
    failure_modes:
    - form-fill
    curation_note: A create request is a workflow start, and it names every required
      field of the one-page form, so the route is list, open, submit, start with no
      question in between. Nothing starts; the eval caller cannot approve, so the start
      call only reports the form as prepared.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
      expected_trajectory:
      - list_workflows
      - start_workflow_form
      - submit_page
      - start_workflow
      order: exact
  - ArgumentCorrectness:
      tool_name: submit_page
      expected_arguments:
        node_name: ams005
        vendor: Cisco
- name: form-fill-unnamed-task
  inputs: run the product validation
  metadata:
    failure_modes:
    - form-fill
    - workflow-handoff
    curation_note: The workflow is a system task, and the request names neither a target
      nor the word task, so a listing filtered on a guess finds nothing and costs a second
      listing. The task's one page has nothing to ask; nothing starts, the eval caller
      cannot approve.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
    - list_workflows
    - start_workflow_form
    - submit_page
    - start_workflow
  - ArgumentCorrectness:
      tool_name: start_workflow_form
      expected_arguments:
        workflow_key: task_validate_products
- name: form-fill-searched-option
  inputs: create a 10G port for Testaccount
  metadata:
    failure_modes:
    - form-fill
    curation_note: The customer is one of thirty behind a route that searches and never
      gives its whole list, so its id is found with the options search before the page
      is submitted; a name is never submitted as the value.
  expected_output: null
  evaluators:
  - TrajectoryMatch:
    - list_workflows
    - start_workflow_form
    - search_options
    - submit_page
    - start_workflow
  - ArgumentCorrectness:
      tool_name: submit_page
      expected_arguments:
        customer_id: cust-07
        speed: 10G
evaluators:
- MaxToolCalls: 8
report_evaluators: []
