[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.1.0"
description = "pydantic-evals benchmark for the WFO search agent (golden tool-call trajectories)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-evals>=1.14",
    "orchestrator-agent",
    "opentelemetry-sdk>=1.44.0",
]

[tool.uv.sources]
orchestrator-agent = { path = "..", editable = true }

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# run_eval.py must set env defaults and the tracer provider before importing
# the agent and instrumenting pydantic-ai.
"run_eval.py" = ["E402"]
