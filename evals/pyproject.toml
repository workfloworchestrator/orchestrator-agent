[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.1.0"
description = "pydantic-evals benchmark for the WFO search agent (golden tool-call trajectories)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-evals>=1.14",
    "pydantic-ai-slim[anthropic]>=2.0,<3",  # the Anthropic models in ../eval-models.json
    "orchestrator-agent",
    "opentelemetry-sdk>=1.44.0",
]

[tool.uv.sources]
orchestrator-agent = { path = "..", editable = true }
# TEMPORARY, as in ../pyproject.toml: remove on the release of orchestrator-core 5.7.0a4.
orchestrator-core = { url = "https://github.com/workfloworchestrator/orchestrator-core/archive/079668314b7a8d92e0eb97b62cffde3bad93714c.tar.gz" }

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# run_eval.py must set env defaults and the tracer provider before importing
# the agent and instrumenting pydantic-ai.
"run_eval.py" = ["E402"]
